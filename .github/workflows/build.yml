name: Build and deploy channels

on:
  schedule:
    # Every 6 hours. Each build sees about 13 hours of schedule, so consecutive
    # runs overlap and the "Recently aired" history has no gaps.
    - cron: "17 */6 * * *"
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["channels.config.mjs", "src/**", "scripts/**", "wrangler.jsonc", ".github/workflows/**", "package-lock.json"]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Rendered posters are kept between runs so only new logos are fetched.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: posters-${{ github.run_id }}
          restore-keys: posters-

      - name: Test
        run: npm test

      # The addon's address is the custom domain in wrangler.jsonc.
      - name: Read the addon's address
        run: node -e 'const m = require("fs").readFileSync("wrangler.jsonc", "utf8").match(/"pattern":\s*"([^"]+)"/); console.log(`SITE_URL=https://${m[1]}`)' >> "$GITHUB_ENV"

      - name: Build addon
        run: node scripts/build.mjs
        env:
          # Read history.json from the old GitHub Pages site until the new one has its own.
          PREVIOUS_SITE_URL: https://jantoom.github.io/live-channels

      # A failed test or build stops here, so the last good deployment stays up.
      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
