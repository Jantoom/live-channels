name: Build and deploy channels

on:
  schedule:
    # Every 6 hours. Each build sees about 13 hours of schedule, so consecutive
    # runs overlap and the "Recently aired" history has no gaps.
    - cron: "17 */6 * * *"
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["channels.config.mjs", "src/**", "scripts/**", ".github/workflows/**", "package-lock.json"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # Rendered posters are kept between runs so only new logos are fetched.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: posters-${{ github.run_id }}
          restore-keys: posters-

      - name: Test
        run: npm test

      - name: Build addon
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
